<!DOCTYPE html>
<html lang="de">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>
Warenkorb | RollerWerkstatt
</title>



<link rel="stylesheet" href="style.css">


</head>




<body>





<header>




<div class="logo">

🔧 RollerWerkstatt

</div>






<nav>



<a href="index.html">
Start
</a>



<a href="shop.html">
Shop
</a>



<a href="konto.html">
Konto
</a>




<a href="warenkorb.html">

🛒 Warenkorb

<span id="cartCount">
0
</span>

</a>



</nav>




</header>








<!-- Nachricht Fenster -->


<div id="messageBox" class="message-box">



<div class="message-content">



<p id="messageText">
</p>



<div id="messageButtons">
</div>



</div>



</div>









<div class="container">





<div class="box">





<h1>
🛒 Mein Warenkorb
</h1>








<div id="cartContainer">


<p>
Warenkorb wird geladen...
</p>


</div>









<hr>









<h2 id="totalPrice">

Gesamt: 0 €

</h2>









<h3>

📦 Lieferdaten

</h3>








<div class="card">







<p>

Name:

<br>



<input

id="customerName"

type="text"

placeholder="Name">



</p>







<p>

E-Mail:

<br>



<input

id="customerEmail"

type="email"

placeholder="E-Mail">



</p>







<p>

Straße:

<br>



<input

id="customerStreet"

type="text"

placeholder="Straße">



</p>







<p>

PLZ:

<br>



<input

id="customerZip"

type="text"

placeholder="Postleitzahl">



</p>







<p>

Ort:

<br>



<input

id="customerCity"

type="text"

placeholder="Ort">



</p>







<p>

Telefon:

<br>



<input

id="customerPhone"

type="text"

placeholder="Telefon">



</p>








<button onclick="saveDeliveryData()">


💾 Lieferdaten speichern


</button>






</div>









<br>









<button onclick="checkout()">


✅ Bestellung abschicken


</button>









</div>




</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>








<script src="js/firebase.js"></script>


<script src="js/message.js"></script>


<script src="js/cart.js"></script>


<script src="js/warenkorb.js"></script>


<script src="script.js"></script>








</body>


</html>
