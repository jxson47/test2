<!DOCTYPE html>

<html lang="de">


<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Registrierung | RollerWerkstatt
</title>


<link rel="stylesheet"
href="style.css">


</head>



<body>



<div class="container">


<div class="box">


<h1>
👤 Konto erstellen
</h1>


<p>

Erstelle dein Kundenkonto für Shop,
Bestellungen und Reparaturen.

</p>



<br>



<form id="registerForm">



<input

id="name"

placeholder="Vor- und Nachname"

required>



<input

id="email"

type="email"

placeholder="E-Mail"

required>



<input

id="password"

type="password"

placeholder="Passwort"

required>



<h3>
Adresse
</h3>



<input

id="street"

placeholder="Straße + Hausnummer"

required>



<input

id="zip"

placeholder="PLZ"

required>



<input

id="city"

placeholder="Ort"

required>



<h3>
Kontakt
</h3>



<input

id="phone"

placeholder="Telefonnummer"

required>




<button>

Konto erstellen

</button>




</form>



<br>


<a href="login.html">

Bereits registriert?

</a>



</div>


</div>






<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>



<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="script.js"></script>



</body>


</html>
