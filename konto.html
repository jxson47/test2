<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Mein Konto | RollerWerkstatt
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🔧 RollerWerkstatt
</div>


<nav>

<a href="index.html">Start</a>
<a href="shop.html">Shop</a>
<a href="konto.html">Konto</a>

</nav>

</header>




<div class="container">


<div class="box">


<h1>
👤 Mein Kundenkonto
</h1>



<p id="welcome">
Willkommen
</p>



<hr>




<h3>
Meine Daten
</h3>



<div class="account-info">


<p>
🆔 Kunden-ID:
<br>

<span id="customerID">
Lädt...
</span>

</p>



<p>
📧 E-Mail:
<br>

<span id="customerEmail">
Lädt...
</span>

</p>




<p>
👤 Name:
<br>

<input 
id="customerName"
type="text"
placeholder="Name">

</p>





<p>
📍 Adresse:
<br>

<input 
id="customerAddress"
type="text"
placeholder="Adresse">

</p>





<p>
📞 Telefon:
<br>

<input 
id="customerPhone"
type="text"
placeholder="Telefon">

</p>




</div>




<br>


<button onclick="saveAccountData()">

Daten speichern

</button>




<hr>







<h3>
🛒 Meine Bestellungen
</h3>

<div id="ordersContainer">

<p>

Bestellungen werden geladen...

</p>

</div>




<br>



<div class="account-actions">


<button onclick="logout()">

Abmelden

</button>



<button onclick="deleteAccount()">

Konto löschen

</button>



</div>



</div>

</div>





<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>



<script src="js/firebase.js"></script>

<script src="js/konto.js"></script>

<script src="script.js"></script>


</body>


</html>
